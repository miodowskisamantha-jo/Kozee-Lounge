media:
  input: images
  output: /Kozee-Lounge/images

content:
  - name: site-content
    label: Specials, Events & Memories
    type: file
    path: site-content.json
    format: json
    fields:
      - name: specials
        label: Today's Specials
        type: object
        fields:
          - name: description
            label: Special or description
            type: text
          - name: happy_hour
            label: Happy hour heading
            type: string
          - name: schedule
            label: Happy hour schedule
            type: string
          - name: sunday
            label: Sunday special
            type: string
      - name: announcements
        label: Latest Announcements
        type: object
        list: true
        fields:
          - name: title
            label: Announcement title
            type: string
          - name: details
            label: Announcement text
            type: text
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Event name
            type: string
          - name: details
            label: Time and details
            type: text
      - name: birthdays
        label: Annual Birthdays
        type: object
        list: true
        fields:
          - name: name
            label: Name to display
            type: string
          - name: date
            label: Birthday date (MM-DD; repeats yearly)
            type: string
          - name: note
            label: Optional note
            type: text
      - name: rules
        label: Rules & Policies
        type: object
        list: true
        fields:
          - name: text
            label: Rule text
            type: text
      - name: gallery
        label: Gallery photos
        type: object
        list: true
        fields:
          - name: image
            label: Photo
            type: image
          - name: alt
            label: Photo description
            type: string
